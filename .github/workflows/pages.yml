name: Test & Deploy

# Die App braucht keinen Bauschritt: Was im Verzeichnis liegt, wird
# unverändert veröffentlicht. Für die Installation auf dem iPhone ist
# HTTPS Pflicht – das liefert GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Navigationsrechnung prüfen
        run: npm test

      - name: Browser für den Rauchtest bereitstellen
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Einzeldatei bauen
        run: npm run build:single

      - name: Rauchtest im Browser
        run: node tools/smoke.mjs

  deploy:
    # Veröffentlicht wird nur der Stand auf main, nicht jeder Pull Request.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Die Einzeldatei wird mitveröffentlicht, damit sie sich ohne
      # Bauwerkzeug herunterladen und als Sicherung ablegen lässt.
      - name: Einzeldatei bauen
        run: |
          npm install --no-audit --no-fund
          npm run build:single

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
