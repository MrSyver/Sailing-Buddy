<!doctype html>
<meta charset="utf-8">
<title>Knotenwerkstatt</title>
<style>
  body { background:#0f1216; color:#e8edf3; font:14px system-ui; margin:0; padding:16px; }
  .row { display:flex; flex-wrap:wrap; gap:14px; }
  figure { margin:0; }
  figcaption { text-align:center; font-size:12px; color:#98a4b3; margin-top:4px; }
  .knot-fig { width:440px; height:440px; background:#1a2029; border-radius:12px; display:block; }
  .knot-core   { fill:none; stroke:#d8c08a; stroke-width:5.5; stroke-linecap:round; stroke-linejoin:round; }
  .knot-core-b { stroke:#7fb3c7; }
  .knot-tip    { fill:#d8c08a; }
  .knot-tip-b  { fill:#7fb3c7; }
  .knot-prop   { fill:#39424f; stroke:#5a6572; stroke-width:2; }
  .knot-prop-ring { fill:none; stroke:#5a6572; stroke-width:7; }
  .grid { stroke:#2a323d; stroke-width:.4; }
  .nr { fill:#ff7b6b; font:3.6px system-ui; }
  .nrb { fill:#6bd0ff; }
</style>
<div class="row" id="out"></div>
<script type="module">
import { knotFigure } from '../js/lib/knotdraw.js';
import { KNOT_DRAWINGS } from '../js/data/knotpaths.js';

const params = new URLSearchParams(location.search);
const nur = params.get('k');
const out = document.getElementById('out');
const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs, text) => {
  const n = document.createElementNS(NS, name);
  Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
  if (text !== undefined) n.textContent = text;
  return n;
};

for (const id of (nur ? nur.split(',') : Object.keys(KNOT_DRAWINGS))) {
  const d = KNOT_DRAWINGS[id];
  if (!d) continue;
  const fig = document.createElement('figure');
  const bild = knotFigure(d, { titel: id });

  if (params.has('grid')) {
    for (let i = 10; i < 100; i += 10) {
      bild.insertBefore(el('line', { class: 'grid', x1: 0, y1: i, x2: 100, y2: i }), bild.firstChild);
      bild.insertBefore(el('line', { class: 'grid', x1: i, y1: 0, x2: i, y2: 100 }), bild.firstChild);
    }
  }
  // Die Stützpunktnummern sind beim Zeichnen das Wichtigste: `unter` wird in
  // ihnen angegeben, und ohne sie sucht man die Stelle im Bild.
  if (params.has('nummern')) {
    (d.lines ?? []).forEach((linie, nr) => linie.p.forEach(([x, y], i) => {
      bild.appendChild(el('circle', { cx: x, cy: y, r: .8, fill: nr ? '#6bd0ff' : '#ff7b6b' }));
      bild.appendChild(el('text', { class: `nr${nr ? ' nrb' : ''}`, x: x + 1.4, y: y - 1.4 }, i));
    }));
  }

  fig.appendChild(bild);
  const cap = document.createElement('figcaption');
  cap.textContent = id;
  fig.appendChild(cap);
  out.appendChild(fig);
}
</script>
