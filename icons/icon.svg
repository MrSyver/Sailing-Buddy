<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sailing Buddy">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10304d"/>
      <stop offset="1" stop-color="#0a1e33"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="102" ry="102"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- Wasserlinie -->
    <rect y="379" width="512" height="133" fill="#1a3e5c"/>
    <!-- Rumpf -->
    <path d="M87 376 H425 L374 417 H148 Z" fill="#c8d6e2"/>
    <!-- Großsegel -->
    <path d="M264 82 V363 H410 Z" fill="#f5f9fc"/>
    <!-- Vorsegel -->
    <path d="M248 123 V363 H133 Z" fill="#f5f9fc"/>
    <!-- Mast -->
    <rect x="252" y="72" width="8" height="304" fill="#f5f9fc"/>
    <!-- Positionslaternen -->
    <circle cx="105" cy="372" r="17" fill="#ff453a"/>
    <circle cx="407" cy="372" r="17" fill="#32d74b"/>
  </g>
</svg>
